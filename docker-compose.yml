
services:
  redis:
    image: redis:7-alpine
    command: ["redis-erver", "--appendonly", "yes"]
    volumes:
      - redi-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ./api_bin
    ports:
      - "8080:8080"
    depends_on:
      - redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - HTTP_ADDR=:8080

  worker:
    build: .
    command: ./worker_bin
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379